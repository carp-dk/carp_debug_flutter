name: Publish to pub.dev

# Automated publishing via pub.dev's GitHub Actions OIDC integration
#
# Setup:
#   1. pub.dev → package Admin tab → "Automated publishing":
#        • Enable "Publishing from GitHub Actions"
#        • Repository:  carp-dk/carp_debug_flutter
#        • Tag pattern: v{{version}}
#   2. GitHub → repo Settings → Environments → create an environment named
#      `pub.dev` and add "Required reviewers".
#
# To release: bump `version:` in pubspec.yaml, add a CHANGELOG entry, then push
# a matching tag, e.g. for version 0.1.2:
#   git tag v0.1.2 && git push origin v0.1.2
on:
  push:
    tags:
      # Must align with the tag pattern configured on pub.dev (v{{version}}).
      # In GitHub tag filters `+` means "one or more", so `[0-9]+` is digits.
      # Only clean MAJOR.MINOR.PATCH tags trigger a release (no build metadata
      # or pre-release suffixes — broaden this if you ever publish those).
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # Fail fast — before the irreversible publish — if the pushed tag does not
  # match the pubspec version, or the CHANGELOG is missing an entry for it.
  guard:
    name: Verify tag matches pubspec & CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Tag must equal pubspec version
        run: |
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=$TAG pubspec=$PUBSPEC_VER"
          if [ "$PUBSPEC_VER" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match pubspec version $PUBSPEC_VER. Bump pubspec.yaml or retag."
            exit 1
          fi
      - name: CHANGELOG must mention the version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          if ! grep -qE "^#+ +\[?${TAG//./\\.}\]?\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $TAG (expected a heading like '## $TAG')."
            exit 1
          fi

  publish:
    needs: guard
    permissions:
      id-token: write # mint the OIDC token pub.dev verifies
      contents: read
    # `environment: pub.dev` ties this job to the protected GitHub Environment
    # configured above, so a reviewer must approve before the OIDC token is
    # minted and `dart pub publish` runs.
    with:
      environment: pub.dev
    # SHA-pinned reusable workflow (this is the only job with publish rights, so
    # it is the highest-value pin). It installs the Flutter SDK (needed to
    # resolve `sdk: flutter`) and runs `dart pub publish` against the OIDC token.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
