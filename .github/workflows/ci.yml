name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only keep the latest run per ref; cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Minimum supported toolchain. Dart 3.12.2 (pubspec `sdk: ^3.12.2`) first ships
  # with Flutter 3.44.2, so that is the floor we build and test against.
  FLUTTER_VERSION: "3.44.2"
  FLUTTER_CHANNEL: "stable"
  JAVA_VERSION: "17"

# Third-party actions are pinned to full commit SHAs (with a version comment) for
# supply-chain safety; the trailing `# vX` keeps Dependabot bumping them cleanly.
jobs:
  analyze:
    name: Format, analyze & publishability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install example dependencies
        # `flutter analyze` and `dart format` walk into example/, so it needs
        # its own resolved package config to avoid unresolved-import errors.
        working-directory: example
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Validate package is publishable
        run: dart pub publish --dry-run

  pigeon:
    name: Pigeon bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Regenerate Pigeon output
        run: |
          dart run pigeon --input pigeons/messages.dart
          # Pigeon emits its Dart output in the "short" style; normalise it to
          # the repo's `dart format` (tall) style so this check compares the
          # schema's semantics rather than formatter quirks.
          dart format lib/src/platform/messages.g.dart
      - name: Fail if generated code drifted from the schema
        run: |
          if ! git diff --exit-code -- \
            lib/src/platform/messages.g.dart \
            ios/carp_debug_flutter/Sources/carp_debug_flutter/Messages.g.swift \
            android/src/main/kotlin/dk/carp/carp_debug_flutter/Messages.g.kt; then
            echo "::error::Pigeon output is stale. Run 'dart run pigeon --input pigeons/messages.dart' and commit the result."
            exit 1
          fi

  test:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "min · Flutter 3.44.2"
            version: "3.44.2"
            channel: stable
          - label: "latest stable"
            version: ""
            channel: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # An empty version makes the action resolve the latest of `channel`.
          flutter-version: ${{ matrix.version }}
          channel: ${{ matrix.channel }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage report
        if: matrix.version == '3.44.2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build debug APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  build-ios:
    name: Build iOS example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build iOS app (no code signing)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
