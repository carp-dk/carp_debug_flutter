version: 2
updates:
  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Keep Dart/Flutter dependencies current for the plugin and its example.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
    labels:
      - dependencies
